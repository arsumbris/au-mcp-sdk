# serves-files-meta — "when this tool is called, it SERVES these file(s), as a function of
# the call input". A tool declares it in its `mcp.tool` subtype's `meta:` block (never
# instance fields — meta is type-level, read off the def via the engine's `subtypes` read,
# the same channel `plugin-runtime-meta` + `tool-presentation-meta` ride).
#
# WHY: a read-precondition ("must have read file X") is satisfied when a file enters the
# session read-view. `read_file` populates it directly. But the ergonomic way to read a
# guide is `au_guide {scenario}`, which serves the guide without a `read_file`. This meta
# lets the daemon RECOMPUTE, at OBSERVE (the session-bound hook path — it carries
# `tool_name` + `tool_input`), which file a call served, and register it — so calling the
# tool COUNTS as reading. See [[decision - 2607030037 - au_guide satisfies a read-precondition
# via a declarative typed serves-contract, not a text sentinel]].
#
# SPOOF-RESISTANCE is the whole point: the served file is derived from the OBSERVED CALL
# (tool name + input) plus this typed contract, NEVER from the tool's response text (which
# an agent can forge via any other tool). A rogue agent cannot fake having called the tool.
#
# `pathTemplate` is a path relative to the tool's PACKAGE ROOT (where its type-def lives),
# with `{field}` placeholders substituted from the call input. E.g. au_guide declares
# `guides/{scenario}.md`; a call `au_guide {scenario: "schema-induction"}` serves
# `<pkg>/guides/schema-induction.md`. The daemon GUARDS the substitution: a `{field}` value
# must be a single plain path segment (no `/`, `\`, `..`) and the resolved path must stay
# inside the package root and exist — else it registers nothing (a path-traversal input, or
# a task-map call with no scenario, serves no specific file). Owned here (au-mcp-sdk).
#
# Mixes in the schema-18 nominal-meta marker so it is meta-legal (closure includes
# `au.engine.meta::au-engine`).
extends: au.engine.meta::au-engine
fields:
  # A package-root-relative path with `{inputField}` placeholders, e.g. "guides/{scenario}.md".
  pathTemplate: String
